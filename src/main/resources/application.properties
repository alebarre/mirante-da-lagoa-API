spring.application.name=mirante-lagoa

# PostgreSQL - configure via variaveis de ambiente
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/mirante_lagoa}
spring.datasource.username=${DB_USER:}
spring.datasource.password=${DB_PASS:}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:true}

# JWT - JWT_SECRET obrigatorio em producao. Fallback local temporario.
app.jwt.secret=${JWT_SECRET:}
app.jwt.access-token-expiration-ms=${JWT_ACCESS_EXP:900000}
app.jwt.refresh-token-expiration-ms=${JWT_REFRESH_EXP:604800000}

# Mail (configure via variaveis de ambiente)
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USER:}
spring.mail.password=${SMTP_PASS:}
spring.mail.default-encoding=UTF-8
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.starttls.required=${SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
spring.mail.from=${SMTP_FROM:}

# CORS
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:4200}

# Server
server.port=${SERVER_PORT:8080}